# @file   pnpm-workspace.yaml
# @module repo
# @brief  Declares the workspace packages and the pnpm settings of the monorepo.
#
# Responsibility: list where pnpm finds the shared packages and the apps; hold pnpm's own
#                 settings (pnpm 11+ reads them here, not from .npmrc).
# Spec:           docs/spec/10-repository-structure.md §1, Bingo 08 §8
packages:
  - packages/*
  # Game modules and their registry (docs/spec/04-software-architecture.md §3).
  - games/*
  - apps/*

# Refuse installs on a Node version outside package.json "engines".
engineStrict: true
# "pnpm add" pins exact versions; upgrades arrive as Renovate PRs (Bingo 08 §7).
saveExact: true

# Dependency install scripts run only when listed here as true.
allowBuilds:
  # Its postinstall only downloads a native binding as a fallback; the platform-specific
  # optional dependency already ships it.
  unrs-resolver: false
  # Its postinstall runs "lefthook install" (skipped in CI), wiring the git hooks of lefthook.yml.
  lefthook: true
  # Pulled by @testcontainers/postgresql through dockerode-ssh-agent/ssh2; the dev deps
  # Testcontainers uses to talk to Docker. Their postinstalls just build native crypto
  # helpers; keeping them disabled only degrades to a slower JS fallback, so leave off
  # unless there is a measurable reason to flip them on.
  cpu-features: false
  ssh2: false
  esbuild: false
  protobufjs: false

# Forced versions for transitive dependencies. Remove an entry once its parent ships the fix.
overrides:
  # eslint-plugin-boundaries 7.2.0 pins handlebars 4.7.9 (GHSA-8r5x-fm3f-whwj, GHSA-p8wg-vrv2-v86f,
  # GHSA-xw65-4hp5-5hc7); 4.7.10 is the patch release that fixes them.
  handlebars@4.7.9: 4.7.10
