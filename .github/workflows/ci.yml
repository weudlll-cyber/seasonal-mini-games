# @file   .github/workflows/ci.yml
# @module ci
# @brief  CI: verify, security scans, docs links, browser tests and the container image.
#
# Responsibility: run what "pnpm verify" runs and the domain/application coverage, the
#                 dependency/secret scans, the license check of the production
#                 dependencies, the markdown link check and the Playwright suite in three
#                 browsers on every push; on the way to master also the image build, scan
#                 and size check. Any red job blocks merge.
# Depends on:     .github/actions/setup, Dockerfile, osv-scanner.toml, e2e/
# Spec:           Bingo 08 §3–§4, Bingo 03 §18
name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  # One group per branch and event, so a push and its PR do not cancel each other.
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  # Every merge commit on master must get its own finished run.
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

# Scanner images pinned by digest, like the actions by commit SHA.
env:
  OSV_SCANNER_IMAGE: ghcr.io/google/osv-scanner:v2.7.0@sha256:4f3b7e2c64b9d38a5febc5a7e4a3dfef1d1362f726dea7a2ef4762b46469fcd0
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
  TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222
  LYCHEE_IMAGE: lycheeverse/lychee:0.24.2@sha256:e2d19e57cf6ab037026f20b8e449a1f30d9d7f81eef4194763aab2eab20bd28d

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # The same script developers run locally: format check, lint, typecheck, tests.
      - run: pnpm verify
      # Domain and application coverage against the thresholds in vitest.config.ts (12 §2).
      - run: pnpm test:coverage

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks scans the full history, not just the last commit.
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: pnpm audit (production dependencies)
        run: pnpm audit --prod --audit-level high
      - name: osv-scanner (lockfile)
        run: |
          set +e
          docker run --rm -v "$PWD:/src" -w /src "$OSV_SCANNER_IMAGE" scan source \
            --config=osv-scanner.toml --lockfile=pnpm-lock.yaml --format json --output-file osv.json
          code=$?
          set -e
          # Exit 1 means "findings"; anything else besides 0 is a scanner error.
          if [ "$code" -ne 0 ] && [ "$code" -ne 1 ]; then exit "$code"; fi
          jq -r '.results[]?.packages[]? | .package as $p | .groups[]?
            | "\($p.name)@\($p.version) \(.ids | join(",")) severity=\(.max_severity // "unknown")"' osv.json
          # High = CVSS >= 7. An unrated finding counts as high so nothing slips through.
          high=$(jq '[.results[]?.packages[]?.groups[]?
            | select((.max_severity // "") == "" or (.max_severity | tonumber) >= 7)] | length' osv.json)
          if [ "$high" -gt 0 ]; then
            echo "::error::$high high or critical osv-scanner finding(s)"
            exit 1
          fi
      - name: gitleaks (full history)
        run: docker run --rm -v "$PWD:/repo" "$GITLEAKS_IMAGE" git /repo --redact --no-banner --exit-code 1
      # Licenses compatible with AGPL-3.0-or-later only (spec 03 §18); a new one fails until reviewed.
      - name: License check (production dependencies)
        run: |
          allowed='["MIT","ISC","0BSD","BSD-2-Clause","BSD-3-Clause","Apache-2.0","BlueOak-1.0.0","CC0-1.0","Unlicense","MPL-2.0","LGPL-3.0-or-later","GPL-3.0-or-later","AGPL-3.0-or-later"]'
          denied=$(pnpm -r licenses list --prod --json | jq -r --argjson ok "$allowed" \
            'to_entries[] | select(.key as $k | $ok | index($k) | not) | "\(.key): \([.value[].name] | join(", "))"')
          if [ -n "$denied" ]; then
            echo "::error::licenses not on the allow list:"
            echo "$denied"
            exit 1
          fi

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Links between the repository's own files (no network: external sites come and go).
      - name: Markdown link check
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$LYCHEE_IMAGE" --offline --no-progress \
            --exclude-path node_modules --exclude-path reports '**/*.md'

  e2e:
    # On every push and pull request: a branch learns of a red browser test before it
    # reaches master (MERGE-AUDIT-1: master went red four times on tests no branch had run).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Playwright browsers (Chromium, Firefox, WebKit)
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      # Playwright starts its web servers before its global setup, so PostgreSQL must be up
      # first: the server migrates on start and exits when the database is unreachable.
      - name: PostgreSQL (ops/compose.dev.yml)
        run: docker compose --env-file ops/.env.dev.example -f ops/compose.dev.yml up -d --wait postgres
      # The server on 3910 and the client on 5410 (e2e/playwright.config.ts).
      - run: pnpm e2e
      # On a failure: the traces and page snapshots of the failed tests, for a week.
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-results
          path: test-results
          retention-days: 7

  image:
    # Only on the way to master: PRs to master and pushes to master.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    env:
      IMAGE: smg:ci
      # Size budget from Bingo 08 §3 (uncompressed, as Docker reports it).
      MAX_IMAGE_BYTES: 250000000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t "$IMAGE" .
      - name: Trivy (HIGH/CRITICAL with a fix available)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" image \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress "$IMAGE"
      - name: Size budget
        run: |
          size=$(docker image inspect "$IMAGE" --format '{{.Size}}')
          echo "Image size: $((size / 1000000)) MB (budget $((MAX_IMAGE_BYTES / 1000000)) MB)"
          if [ "$size" -gt "$MAX_IMAGE_BYTES" ]; then
            echo "::error::Image exceeds the size budget"
            exit 1
          fi
