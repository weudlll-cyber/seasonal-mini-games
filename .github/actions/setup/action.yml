# @file   .github/actions/setup/action.yml
# @module ci
# @brief  Shared job setup: pnpm, Node and a frozen-lockfile install.
#
# Responsibility: one place for the toolchain setup every Node job repeats; versions come
#                 from package.json "packageManager" and .nvmrc, never from the workflow.
# Used by:        .github/workflows/ci.yml (jobs verify, security, e2e)
# Spec:           Bingo 08 §3, Bingo 03 §18
name: Setup
description: Install pnpm and Node, restore the pnpm store cache and install dependencies.
runs:
  using: composite
  steps:
    # No version input: the action reads "packageManager" from package.json.
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
