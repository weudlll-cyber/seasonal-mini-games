<!doctype html>
<!--
  @file   apps/web/index.html
  @module web
  @brief  The player client's page: the root element, the early theme script, the entry module.

  Responsibility: load public/theme-init.js before the first paint (an external file: the
                  CSP forbids inline scripts), then the React entry ./src/main.tsx into #root.
  Depends on:     public/theme-init.js, src/main.tsx
  Spec:           Bingo 01 §13; Bingo 03 §7
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Seasonal Mini Games</title>
    <!-- Sets data-theme before the first paint; an external file, as the CSP forbids inline scripts -->
    <script src="theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
