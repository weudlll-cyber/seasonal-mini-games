# @file   ops/compose.website.yml
# @module ops
# @brief  Website installs: the app joins the Seasonal Entertainment website's network.
#
# Responsibility: on top of ops/compose.yml, without the Caddy profile: the app publishes no
#                 host port and joins the website's Docker network (chosen by ops/install.sh:
#                 the website project's <project>_default network of the container
#                 seasonal-site-caddy-1, or --website-network, asking when it is ambiguous;
#                 written to SMG_WEBSITE_NETWORK) under the name smg-mini-games-<env>,
#                 so the website's Caddy forwards /games/mini-games/* (HTTP and WebSocket) to it.
# Used by:        ops/install.sh, ops/smg (copied to /opt/smg/compose.website.yml)
# Spec:           docs/spec/10-repository-structure.md §6; Bingo 09 §1, §8
services:
  app:
    networks:
      website:
        aliases:
          - smg-mini-games-${SMG_ENV:?set SMG_ENV in the env file}

networks:
  website:
    external: true
    name: ${SMG_WEBSITE_NETWORK:?set SMG_WEBSITE_NETWORK in the env file}
