# @file   ops/examples/nginx.conf
# @module ops
# @brief  Example: Seasonal Mini Games behind an existing nginx (no Caddy of its own).
#
# Responsibility: forward the whole site (pages, /api) and the WebSocket /ws to the app,
#                 with the upgrade headers the WebSocket needs and the visitor's address in
#                 X-Forwarded-For. The app must trust this proxy: SMG_TRUSTED_PROXIES=<nginx
#                 address>, and SMG_PUBLIC_URL=https://games.example.org/ in /etc/smg/<env>.env.
#                 The app container publishes no port by default; publish 127.0.0.1:3100
#                 (a compose override) or put nginx on the app's Docker network.
# Spec:           docs/spec/10-repository-structure.md §6; Bingo 09 §8
#
# Under a path instead (e.g. /games/mini-games/): set SMG_BASE_PATH=/games/mini-games/, use
# "location /games/mini-games/ { … }" with the same lines and keep the path (no trailing
# slash after proxy_pass's address), redirect /games/mini-games to /games/mini-games/, and answer
# "location /games/mini-games/metrics { return 404; }".

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    http2 on;
    server_name games.example.org;
    ssl_certificate     /etc/letsencrypt/live/games.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/games.example.org/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Long-lived game sockets (the server pings every 20 s).
        proxy_read_timeout 120s;
    }

    # Metrics stay inside.
    location /metrics { return 404; }
}

server {
    listen 80;
    server_name games.example.org;
    return 301 https://$host$request_uri;
}
