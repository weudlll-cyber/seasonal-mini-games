# @file   ops/compose.dev.yml
# @module ops
# @brief  Local development services: PostgreSQL 17 and Mailpit.
#
# Responsibility: the backing services "pnpm dev" needs, reachable from this machine only
#                 (ports bound to 127.0.0.1). Not for staging or production (ops/compose.yml).
# Depends on:     ops/.env.dev.example (ports, placeholder credentials), optional ops/.env.dev
# Spec:           Bingo 08 §1, Bingo 09 §1
#
# Start (paths relative to the repository root):
#   docker compose --env-file ops/.env.dev.example -f ops/compose.dev.yml up -d
# Personal overrides (ignored by git) go in a second, later --env-file ops/.env.dev.
# Every value comes from the env file; ":?" stops Compose if it was not passed.
name: smg-dev

services:
  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?pass --env-file ops/.env.dev.example}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?pass --env-file ops/.env.dev.example}
      POSTGRES_DB: ${POSTGRES_DB:?pass --env-file ops/.env.dev.example}
    ports:
      - '127.0.0.1:${SMG_DEV_POSTGRES_PORT:?pass --env-file ops/.env.dev.example}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10

  # Catches every outgoing mail of the dev server.
  mailpit:
    image: axllent/mailpit:v1.31.6@sha256:23fe39e81bde596a918000b3135c0f85dc8bb4c9ea6be274b051143f3e300387
    ports:
      - '127.0.0.1:${SMG_DEV_MAILPIT_SMTP_PORT:?pass --env-file ops/.env.dev.example}:1025'
      - '127.0.0.1:${SMG_DEV_MAILPIT_UI_PORT:?pass --env-file ops/.env.dev.example}:8025'

volumes:
  pgdata:
